<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>333 OIL · Панель владельца</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FFFFFF;--panel:#F2F6FC;--panel-2:#EAF1FB;--paper:#FFFFFF;--paper-line:#DCE8F8;
    --blue:#155CE0;--blue-deep:#0A2E6B;--blue-dim:#5A83C4;--green:#1E9E6B;--red:#D1473A;
    --text:#16233B;--muted:#6C7C93;--mono:'IBM Plex Mono', monospace;--sans:'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#0A1116;font-family:var(--sans);display:flex;justify-content:center;padding:24px 12px;min-height:100vh;}
  .phone{width:390px;max-width:100%;background:var(--ink);border-radius:34px;border:1px solid #D3E0F2;box-shadow:0 40px 80px -30px rgba(10,46,107,.35);overflow:hidden;color:var(--text);position:relative;}
  .notch{height:26px;display:flex;align-items:center;justify-content:center;}
  .notch::before{content:'';width:90px;height:6px;border-radius:6px;background:#000;opacity:.5;}
  header{padding:6px 20px 14px;border-bottom:1px solid #E1EAF6;background:linear-gradient(180deg,#F2F7FE,#FFFFFF);}
  .row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:6px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:var(--blue-deep);color:#fff;font-family:var(--mono);font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;}
  .brand .word{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--blue-deep);}
  .brand .word span{color:var(--blue);font-weight:500;}
  .langtoggle{display:flex;background:#EAF1FB;border-radius:999px;padding:3px;border:1px solid #D3E0F2;}
  .langtoggle button{border:none;background:transparent;color:var(--blue-dim);font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;}
  .langtoggle button.active{background:var(--blue);color:#fff;}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--blue-deep);}
  nav.tabs{display:flex;gap:4px;margin-top:14px;background:#EAF1FB;border-radius:12px;padding:4px;}
  nav.tabs button{flex:1;border:none;background:transparent;padding:8px 4px;border-radius:9px;font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--blue-dim);cursor:pointer;}
  nav.tabs button.active{background:var(--blue);color:#fff;}
  .station-row{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;}
  .station-row::-webkit-scrollbar{display:none;}
  .station-chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid #D3E0F2;background:#fff;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--blue-dim);cursor:pointer;white-space:nowrap;}
  .station-chip.active{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff;}
  .station-chip.add{border:1px dashed var(--blue-dim);color:var(--blue-dim);background:#fff;}
  main{padding:18px 18px 24px;height:600px;overflow-y:auto;}
  section{display:none;}
  section.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .section-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:'';flex:1;height:1px;background:#DCE8F8;}
  .request-card{background:var(--panel);border:1px solid #D3E0F2;border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .request-card .name{font-weight:700;color:var(--blue-deep);font-size:14.5px;}
  .request-card .phone{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px;}
  .request-card .meta{font-size:11px;color:var(--muted);margin-top:6px;}
  .request-actions{display:flex;gap:8px;margin-top:12px;}
  .request-actions button{flex:1;padding:10px;border-radius:9px;border:none;font-weight:600;font-size:13px;cursor:pointer;}
  .btn-approve{background:var(--green);color:#fff;}
  .btn-reject{background:#fff;border:1px solid #E3B9B2;color:var(--red);}
  .empty-hint{font-size:12.5px;color:var(--muted);text-align:center;padding:30px 10px;}
  .date-row{display:flex;gap:8px;margin-bottom:14px;align-items:center;}
  .date-row input[type=date]{flex:1;padding:9px 10px;border-radius:9px;border:1px solid #D3E0F2;font-family:var(--sans);font-size:13px;color:var(--text);}
  .date-row button{padding:9px 12px;border-radius:9px;border:1px solid #D3E0F2;background:#fff;color:var(--blue-dim);font-weight:600;cursor:pointer;font-size:12px;}
  .grand{background:linear-gradient(160deg,var(--blue-deep),var(--blue));border-radius:16px;padding:18px;text-align:center;margin-bottom:14px;}
  .grand .lbl{font-size:11px;color:#CBDCF7;text-transform:uppercase;letter-spacing:.1em;}
  .grand .amt{font-family:var(--mono);font-size:28px;font-weight:700;color:#fff;margin-top:4px;}
  .summary-card{background:var(--panel-2);border:1px solid #D3E0F2;border-radius:16px;padding:16px;margin-bottom:14px;}
  .summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #DCE8F8;font-size:13px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .v{font-family:var(--mono);font-weight:600;color:var(--blue-deep);}
  .shift-card{background:var(--panel);border:1px solid #D3E0F2;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:12.5px;}
  .shift-card .top{display:flex;justify-content:space-between;font-weight:600;color:var(--blue-deep);margin-bottom:4px;}
  .shift-card .time{font-family:var(--mono);color:var(--muted);font-size:11px;}
  .alert-card{background:#FBEAE7;border:1px solid var(--red);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.5;margin-bottom:10px;color:#8A2E22;display:flex;gap:9px;}
  .chat-log{margin-bottom:12px;}
  .msg{margin-bottom:12px;display:flex;}
  .msg.user{justify-content:flex-end;}
  .bubble{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;}
  .msg.user .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:4px;}
  .msg.ai .bubble{background:var(--panel);border:1px solid #D3E0F2;color:var(--text);border-bottom-left-radius:4px;}
  .ai-tag{font-family:var(--mono);font-size:9.5px;color:var(--blue-dim);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase;}
  .chat-input-row{display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:10px;}
  .chat-input-row input{flex:1;padding:11px 13px;border-radius:11px;border:1px solid #C5D8F0;background:#F7FAFE;font-family:var(--sans);font-size:13px;color:var(--text);}
  .chat-input-row button{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:0 16px;font-weight:700;cursor:pointer;}
  .settings-card{background:var(--panel);border:1px solid #D3E0F2;border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .settings-card .row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-end;}
  .settings-card label{font-size:10px;color:var(--blue-dim);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px;}
  .settings-card input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #C5D8F0;background:#fff;font-family:var(--sans);font-size:13.5px;color:var(--text);}
  .settings-card button{padding:9px 12px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .hint-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:4px 2px 10px;}
  .lock-badge{font-family:var(--mono);font-size:10px;background:var(--muted);color:#fff;padding:3px 8px;border-radius:6px;margin-left:6px;}
  .spinner{display:flex;justify-content:center;align-items:center;height:200px;color:var(--muted);font-size:13px;}
  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <header>
    <div class="row-top">
      <div class="brand">
        <div class="mark">333</div>
        <div class="word">OIL <span>· Панель</span></div>
      </div>
      <div class="langtoggle">
        <button data-lang="ru" class="active">RU</button>
        <button data-lang="uz">UZ</button>
      </div>
    </div>
    <h1 id="greeting">—</h1>
    <nav class="tabs">
      <button class="active" data-tab="requests"><span id="tabRequestsLabel">Заявки</span> <span id="reqCount"></span></button>
      <button data-tab="reports" id="tabReportsLabel">Отчёты</button>
      <button data-tab="ai" id="tabAiLabel">ИИ</button>
      <button data-tab="settings" id="tabSettingsLabel">Настройки</button>
    </nav>
    <div class="station-row" id="stationRow"></div>
  </header>

  <main>
    <div class="spinner" id="loadingScreen">Загрузка…</div>

    <section id="tab-requests">
      <div id="requestsContent"></div>
    </section>

    <section id="tab-reports">
      <div class="date-row">
        <button id="prevDayBtn">←</button>
        <input type="date" id="reportDate">
        <button id="todayBtn">•</button>
        <button id="nextDayBtn">→</button>
      </div>
      <div id="reportsContent"></div>
    </section>

    <section id="tab-ai">
      <p class="section-label" id="askAiLabel">Спросить ИИ-ассистента</p>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Например: были ли расхождения на этой неделе?">
        <button onclick="sendChat()">→</button>
      </div>
    </section>

    <section id="tab-settings">
      <div id="settingsContent"></div>
    </section>
  </main>
</div>

<script>
const API_BASE = 'https://web-production-0ef7a.up.railway.app';

const dict = {
  ru:{
    greeting:"Панель владельца",
    tabRequests:"Заявки", tabReports:"Отчёты", tabAi:"ИИ", tabSettings:"Настройки",
    pendingLabel:"Ожидают одобрения", approve:"Одобрить", reject:"Отклонить",
    emptyHint:"Новых заявок пока нет.", activeOps:"Активные операторы",
    revenueFor:"Выручка за", totalSold:"Всего продано", discrepancies:"Расхождения", noIssues:"Расхождений нет",
    askAi:"Спросить ИИ-ассистента", aiTag:"ИИ 333 OIL", aiThinking:"Думаю…", aiError:"Не удалось получить ответ. Проверьте, что ключ ИИ настроен, и попробуйте снова.",
    tanksLabel:"Котлы", tankNameLbl:"Название", save:"Сохранить",
    stationNameLbl:"Название станции",
    initCountersLabel:"Начальные показания счётчиков (первый рабочий день)",
    initCountersHint:"Введите текущие числа с колонок А/Б/В/Г. Это можно сделать только один раз — дальше показания будет вести бот автоматически после каждой смены.",
    initCountersBtn:"Сохранить начальные показания",
    countersLockedLabel:"Показания счётчиков",
    countersLockedHint:"Начальные показания уже заданы и заблокированы — теперь бот сам ведёт их после каждой смены.",
    locked:"заблокировано",
    priceHint:"Цену за литр устанавливает оператор перед сдачей смены — она указывается в каждом отчёте.",
    addStation:"+ Станция", newStationName:"Название новой станции:", newStationId:"Короткий ID станции (латиницей, напр. station_2):",
    selectStationHint:"Выберите одну станцию, чтобы редактировать её настройки.",
    noShifts:"Смен за этот день не было.",
    assignStationPrompt:"На какую станцию назначить оператора?",
  },
  uz:{
    greeting:"Egasi paneli",
    tabRequests:"So'rovlar", tabReports:"Hisobotlar", tabAi:"AI", tabSettings:"Sozlamalar",
    pendingLabel:"Tasdiqlanishini kutmoqda", approve:"Tasdiqlash", reject:"Rad etish",
    emptyHint:"Hozircha yangi so'rovlar yo'q.", activeOps:"Faol operatorlar",
    revenueFor:"Tushum —", totalSold:"Jami sotildi", discrepancies:"Farqlar", noIssues:"Farqlar yo'q",
    askAi:"AI-yordamchidan so'rang", aiTag:"333 OIL AI", aiThinking:"O'ylayapman…", aiError:"Javob olib bo'lmadi. AI kaliti sozlanganini tekshiring va qayta urinib ko'ring.",
    tanksLabel:"Qozonlar", tankNameLbl:"Nomi", save:"Saqlash",
    stationNameLbl:"Shoxobcha nomi",
    initCountersLabel:"Boshlang'ich hisoblagich ko'rsatkichlari (birinchi ish kuni)",
    initCountersHint:"A/B/V/G kolonkalaridagi joriy raqamlarni kiriting. Buni faqat bir marta qilish mumkin — keyin bot har bir smenadan so'ng ko'rsatkichlarni o'zi yuritadi.",
    initCountersBtn:"Boshlang'ich ko'rsatkichlarni saqlash",
    countersLockedLabel:"Hisoblagich ko'rsatkichlari",
    countersLockedHint:"Boshlang'ich ko'rsatkichlar allaqachon kiritilgan va bloklangan — endi bot ularni har bir smenadan keyin o'zi yuritadi.",
    locked:"bloklangan",
    priceHint:"Litr narxini operator smenani topshirishdan oldin belgilaydi — u har bir hisobotda ko'rsatiladi.",
    addStation:"+ Shoxobcha", newStationName:"Yangi shoxobcha nomi:", newStationId:"Shoxobcha qisqa ID (lotin harflarida, masalan: station_2):",
    selectStationHint:"Sozlamalarni tahrirlash uchun bitta shoxobchani tanlang.",
    noShifts:"Bu kunda smenalar bo'lmagan.",
    assignStationPrompt:"Operator qaysi shoxobchaga tayinlansin?",
  }
};

let lang = 'ru';
let tgId = '';
let stations = [];          // [{id,name,counters_initialized}]
let currentStationId = null; // null = "все"
let pendingList = [];
let reportDate = new Date().toISOString().slice(0,10);
let stationConfigCache = {};

function t(key){ return dict[lang][key] || key; }
function fmt(n){ return Math.round(n||0).toLocaleString('ru-RU'); }

function getTgId(){
  try{
    const tg = window.Telegram && window.Telegram.WebApp;
    if(tg){
      try{ tg.ready(); }catch(e){}
      if(tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id){
        return String(tg.initDataUnsafe.user.id);
      }
      if(tg.initData){
        const params = new URLSearchParams(tg.initData);
        const userRaw = params.get('user');
        if(userRaw){
          try{
            const user = JSON.parse(userRaw);
            if(user && user.id) return String(user.id);
          }catch(e){}
        }
      }
    }
  }catch(e){}
  const params = new URLSearchParams(location.search);
  return params.get('tg_id') || '';
}

async function api(path, opts={}){
  const url = new URL(API_BASE + path);
  if(!opts.method || opts.method==='GET'){
    url.searchParams.set('tg_id', tgId);
  }
  const finalOpts = Object.assign({}, opts);
  if(finalOpts.method && finalOpts.method!=='GET'){
    url.searchParams.set('tg_id', tgId);
    finalOpts.headers = Object.assign({'Content-Type':'application/json'}, finalOpts.headers||{});
    if(finalOpts.body) finalOpts.body = JSON.stringify(finalOpts.body);
  }
  const res = await fetch(url, finalOpts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw Object.assign(new Error(data.error||'request_failed'), {data});
  return data;
}

function applyStaticLang(){
  document.getElementById('tabRequestsLabel').textContent = t('tabRequests');
  document.getElementById('tabReportsLabel').textContent = t('tabReports');
  document.getElementById('tabAiLabel').textContent = t('tabAi');
  document.getElementById('tabSettingsLabel').textContent = t('tabSettings');
  document.getElementById('askAiLabel').textContent = t('askAi');
  document.getElementById('chatInput').placeholder = lang==='ru' ? 'Например: были ли расхождения на этой неделе?' : 'Masalan: bu hafta farqlar bo\'ldimi?';
  document.getElementById('greeting').textContent = t('greeting');
  document.querySelectorAll('.langtoggle button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
}

document.querySelectorAll('.langtoggle button').forEach(b=>{
  b.addEventListener('click', ()=>{ lang = b.dataset.lang; applyStaticLang(); renderAll(); });
});

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main section').forEach(s=>s.classList.remove('active'));
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

async function renderStationRow(){
  const row = document.getElementById('stationRow');
  let html = `<button class="station-chip ${currentStationId===null?'active':''}" data-station="all">${lang==='ru'?'Все':'Barchasi'}</button>`;
  stations.forEach(s=>{
    html += `<button class="station-chip ${currentStationId===s.id?'active':''}" data-station="${s.id}">${s.name}</button>`;
  });
  html += `<button class="station-chip add" id="addStationBtn">${t('addStation')}</button>`;
  row.innerHTML = html;
  row.querySelectorAll('.station-chip[data-station]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      currentStationId = chip.dataset.station==='all' ? null : chip.dataset.station;
      renderAll();
    });
  });
  document.getElementById('addStationBtn').addEventListener('click', addStationFlow);
}

async function addStationFlow(){
  const name = prompt(t('newStationName'));
  if(!name) return;
  const id = prompt(t('newStationId'));
  if(!id) return;
  try{
    await api('/api/stations/create', {method:'POST', body:{station_id:id.trim(), name:name.trim()}});
    await loadStations();
    renderAll();
  }catch(e){ alert(e.message); }
}

async function loadStations(){
  stations = await api('/api/stations');
  if(currentStationId===null && stations.length){
    // keep "all" as default view — no auto-select
  }
}

// ---------- REQUESTS ----------
async function renderRequests(){
  const container = document.getElementById('requestsContent');
  try{
    pendingList = await api('/api/pending');
  }catch(e){ pendingList = []; }

  document.getElementById('reqCount').textContent = pendingList.length ? '· '+pendingList.length : '';

  let html = `<p class="section-label">${t('pendingLabel')}</p>`;
  if(!pendingList.length){
    html += `<div class="empty-hint">${t('emptyHint')}</div>`;
  } else {
    pendingList.forEach(p=>{
      html += `<div class="request-card">
        <div class="name">${p.name}</div>
        <div class="phone">${p.phone}</div>
        <div class="request-actions">
          <button class="btn-approve" data-tgid="${p.tg_id}">${t('approve')}</button>
          <button class="btn-reject" data-tgid="${p.tg_id}">${t('reject')}</button>
        </div>
      </div>`;
    });
  }
  container.innerHTML = html;

  container.querySelectorAll('.btn-approve').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      let stationId = currentStationId;
      if(!stationId){
        if(stations.length === 1){ stationId = stations[0].id; }
        else if(stations.length > 1){
          const names = stations.map(s=>s.id+' — '+s.name).join('\n');
          stationId = prompt(t('assignStationPrompt')+'\n'+names, stations[0].id);
          if(!stationId) return;
        } else {
          stationId = 'station_1';
        }
      }
      try{
        await api('/api/pending/resolve', {method:'POST', body:{tg_id: parseInt(btn.dataset.tgid), approve:true, station_id: stationId}});
        renderRequests();
      }catch(e){ alert(e.message); }
    });
  });
  container.querySelectorAll('.btn-reject').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await api('/api/pending/resolve', {method:'POST', body:{tg_id: parseInt(btn.dataset.tgid), approve:false}});
        renderRequests();
      }catch(e){ alert(e.message); }
    });
  });
}

// ---------- REPORTS ----------
function shiftDate(delta){
  const d = new Date(reportDate+'T00:00:00');
  d.setDate(d.getDate()+delta);
  reportDate = d.toISOString().slice(0,10);
  document.getElementById('reportDate').value = reportDate;
  renderReports();
}
document.getElementById('reportDate').addEventListener('change', (e)=>{ reportDate = e.target.value; renderReports(); });
document.getElementById('prevDayBtn').addEventListener('click', ()=>shiftDate(-1));
document.getElementById('nextDayBtn').addEventListener('click', ()=>shiftDate(1));
document.getElementById('todayBtn').addEventListener('click', ()=>{ reportDate = new Date().toISOString().slice(0,10); document.getElementById('reportDate').value = reportDate; renderReports(); });

async function renderReports(){
  document.getElementById('reportDate').value = reportDate;
  const container = document.getElementById('reportsContent');
  let data;
  try{
    const qs = currentStationId ? `&station_id=${currentStationId}` : '';
    data = await api(`/api/reports?date=${reportDate}${qs}`);
  }catch(e){
    container.innerHTML = `<div class="empty-hint">${e.message}</div>`;
    return;
  }

  let html = `<div class="grand"><div class="lbl">${t('revenueFor')} ${reportDate}</div><div class="amt">${fmt(data.total_revenue)} сум</div></div>`;

  if(!data.shifts.length){
    html += `<div class="empty-hint">${t('noShifts')}</div>`;
  } else {
    data.shifts.forEach(s=>{
      const time = (s.submitted_at||'').slice(11,16);
      html += `<div class="shift-card">
        <div class="top"><span>${s.operator_name}</span><span>${fmt(s.total_revenue)} сум</span></div>
        <div class="time">${s.station_name} · ${time} · ${fmt(s.total_liters)} л</div>
      </div>`;
    });
  }

  html += `<p class="section-label">${t('discrepancies')}</p>`;
  const allDiscrepancies = data.shifts.flatMap(s => (s.discrepancies||[]).map(d=>({...d, operator:s.operator_name, station:s.station_name})));
  if(allDiscrepancies.length){
    allDiscrepancies.forEach(d=>{
      html += `<div class="alert-card">⚠️ <span>${d.station} · ${d.operator} · Котёл ${d.tank_id}: ${d.diff_liters>0?'+':''}${d.diff_liters} л</span></div>`;
    });
  } else {
    html += `<div class="empty-hint">${t('noIssues')}</div>`;
  }

  container.innerHTML = html;
}

// ---------- SETTINGS ----------
async function renderSettings(){
  const container = document.getElementById('settingsContent');
  if(!currentStationId){
    container.innerHTML = `<div class="empty-hint">${t('selectStationHint')}</div>`;
    return;
  }
  let cfg;
  try{
    cfg = await api(`/api/config?station_id=${currentStationId}`);
    stationConfigCache[currentStationId] = cfg;
  }catch(e){
    container.innerHTML = `<div class="empty-hint">${e.message}</div>`;
    return;
  }

  let html = `<div class="settings-card">
    <label>${t('stationNameLbl')}</label>
    <div class="row"><input type="text" id="stationNameInput" value="${cfg.station_name}"><button id="saveStationNameBtn">${t('save')}</button></div>
  </div>`;

  html += `<p class="section-label">${t('tanksLabel')}</p>`;
  cfg.tanks.forEach(tank=>{
    html += `<div class="settings-card">
      <label>${t('tankNameLbl')}</label>
      <div class="row"><input type="text" class="tank-name-input" data-tank="${tank.id}" value="${tank.name}"><button class="save-tank-btn" data-tank="${tank.id}">${t('save')}</button></div>
    </div>`;
  });
  html += `<p class="hint-note">${t('priceHint')}</p>`;

  if(!cfg.counters_initialized){
    html += `<p class="section-label">${t('initCountersLabel')}</p>
      <p class="hint-note">${t('initCountersHint')}</p>
      <div class="settings-card">`;
    Object.keys(cfg.counter_tags).forEach(tag=>{
      html += `<div class="row"><div style="flex:1"><label>${cfg.counter_tags[tag]}</label><input type="number" inputmode="numeric" class="init-counter-input" data-tag="${tag}" value="0"></div></div>`;
    });
    html += `<button id="saveInitCountersBtn" style="width:100%;margin-top:6px">${t('initCountersBtn')}</button>
      </div>`;
  } else {
    html += `<p class="section-label">${t('countersLockedLabel')} <span class="lock-badge">${t('locked')}</span></p>
      <p class="hint-note">${t('countersLockedHint')}</p>`;
  }

  container.innerHTML = html;

  document.getElementById('saveStationNameBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('stationNameInput').value.trim();
    if(!name) return;
    try{
      await api('/api/stations/rename', {method:'POST', body:{station_id:currentStationId, name}});
      await loadStations();
      renderStationRow();
    }catch(e){ alert(e.message); }
  });

  container.querySelectorAll('.save-tank-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tankId = btn.dataset.tank;
      const name = container.querySelector(`.tank-name-input[data-tank="${tankId}"]`).value.trim();
      try{
        await api('/api/settings', {method:'POST', body:{station_id:currentStationId, tank_names:{[tankId]:name}}});
      }catch(e){ alert(e.message); }
    });
  });

  const initBtn = document.getElementById('saveInitCountersBtn');
  if(initBtn){
    initBtn.addEventListener('click', async ()=>{
      const values = {};
      container.querySelectorAll('.init-counter-input').forEach(inp=>{
        values[inp.dataset.tag] = parseFloat(inp.value)||0;
      });
      try{
        await api('/api/settings/init-counters', {method:'POST', body:{station_id:currentStationId, counter_values:values}});
        renderSettings();
      }catch(e){ alert(e.message); }
    });
  }
}

// ---------- AI ----------
function appendChat(role, text){
  const log = document.getElementById('chatLog');
  if(role==='user'){
    log.insertAdjacentHTML('beforeend', `<div class="msg user"><div class="bubble">${text}</div></div>`);
  } else {
    log.insertAdjacentHTML('beforeend', `<div class="msg ai"><div class="bubble"><div class="ai-tag">${t('aiTag')}</div>${text}</div></div>`);
  }
  log.scrollIntoView({behavior:'smooth', block:'end'});
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  appendChat('user', text);
  input.value = '';
  appendChat('ai', t('aiThinking'));
  const log = document.getElementById('chatLog');
  try{
    const data = await api('/api/ai/ask', {method:'POST', body:{question:text}});
    log.lastElementChild.remove();
    appendChat('ai', data.answer || t('aiError'));
  }catch(e){
    log.lastElementChild.remove();
    appendChat('ai', t('aiError'));
  }
}

async function renderAll(){
  applyStaticLang();
  await renderStationRow();
  await renderRequests();
  await renderReports();
  await renderSettings();
}

async function init(){
  tgId = getTgId();
  if(!tgId){
    let debug = 'DEBUG: ';
    try{
      const tg = window.Telegram && window.Telegram.WebApp;
      debug += 'tg=' + (tg ? 'yes' : 'no');
      if(tg){
        debug += ', initData.length=' + (tg.initData ? tg.initData.length : 0);
        debug += ', platform=' + (tg.platform || '?');
        debug += ', version=' + (tg.version || '?');
        debug += ', hasUser=' + !!(tg.initDataUnsafe && tg.initDataUnsafe.user);
      }
    }catch(e){ debug += 'error: ' + e.message; }
    document.getElementById('loadingScreen').innerHTML = 'Не удалось определить пользователя.<br><br><span style="font-family:monospace;font-size:10px;word-break:break-all;">'+debug+'</span>';
    return;
  }
  try{
    await loadStations();
  }catch(e){
    document.getElementById('loadingScreen').textContent = 'Ошибка загрузки станций.';
    return;
  }
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('tab-requests').classList.add('active');
  document.getElementById('reportDate').value = reportDate;
  await renderAll();
}
init();
</script>
